<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Study | Zeynox Studios</title>
  <meta name="description" content="Project case study for Ali Arsalan's portfolio at Zeynox Studios.">
  <link rel="canonical" href="https://zeynoxstudios.com/portfolio/case-study.html">
  <link rel="icon" type="image/png" href="../favicon.png">
  <style>
    :root {
      --text: #f5f0e8;
      --muted: #c6bfb2;
      --soft: #938c82;
      --accent: #e7d5b6;
      --accent-strong: #fff4df;
      --line: rgba(255,255,255,0.12);
      --font-display: Georgia, "Times New Roman", serif;
      --font-body: "Aptos", "Segoe UI", "Helvetica Neue", sans-serif;
      --font-ui: "Bahnschrift", "Segoe UI", sans-serif;
      --content: 980px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(126, 103, 72, 0.18), transparent 32%),
        linear-gradient(180deg, #0a0a0d 0%, #101014 42%, #09090c 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 80px 80px;
      opacity: 0.25;
      mask-image: linear-gradient(180deg, rgba(0,0,0,0.8), transparent);
    }

    a { color: inherit; }

    .wrap {
      width: min(calc(100% - 32px), var(--content));
      margin: 0 auto;
    }

    .topbar {
      padding: 26px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .topbar-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .brand {
      font-family: var(--font-ui);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.8rem;
      color: var(--accent);
      text-decoration: none;
    }

    .back-link {
      text-decoration: none;
      color: var(--muted);
      font-size: 0.82rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    main {
      padding: 48px 0 56px;
    }

    .eyebrow,
    .section-label,
    .tech-title {
      color: var(--accent);
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    h1, h2 {
      font-family: var(--font-display);
      font-weight: 700;
      line-height: 0.98;
    }

    h1 {
      font-size: clamp(3rem, 8vw, 5.6rem);
      margin: 14px 0 16px;
      max-width: 10ch;
    }

    .intro {
      max-width: 42rem;
      color: var(--accent-strong);
      font-size: 1.12rem;
      line-height: 1.8;
    }

    .meta-grid,
    .section-grid {
      display: grid;
      gap: 18px;
      margin-top: 32px;
    }

    .meta-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border-top: 1px solid var(--line);
      padding-top: 20px;
    }

    .meta-block,
    .section-block {
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .meta-block span,
    .tech-title {
      display: block;
      color: var(--soft);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .meta-block p,
    .section-block p,
    .section-block li {
      color: var(--muted);
      line-height: 1.8;
      font-size: 1rem;
    }

    .section-grid {
      grid-template-columns: 1fr 1fr;
      margin-top: 42px;
    }

    .section-block h2 {
      font-size: 2rem;
      color: var(--accent-strong);
      margin-bottom: 10px;
    }

    .section-block ul {
      list-style: none;
      display: grid;
      gap: 10px;
    }

    .section-block li::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f0dcc0, #8b94a7);
      vertical-align: middle;
      transform: translateY(-1px);
    }

    .tech-strip {
      margin-top: 42px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    .tech-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .footer-actions {
      margin-top: 42px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 999px;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.74rem;
    }

    .action-primary {
      background: linear-gradient(135deg, #f4e7cf, #ddc09a);
      color: #15110d;
    }

    .action-secondary {
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.035);
      color: var(--text);
    }

    @media (max-width: 820px) {
      .meta-grid,
      .section-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="./index.html">Zeynox Studios Portfolio</a>
      <a class="back-link" href="./index.html#work">Back to portfolio</a>
    </div>
  </header>

  <main class="wrap">
    <p class="eyebrow" id="project-category"></p>
    <h1 id="project-name"></h1>
    <p class="intro" id="project-summary"></p>

    <div class="meta-grid">
      <article class="meta-block">
        <span>Role</span>
        <p id="project-role"></p>
      </article>
      <article class="meta-block">
        <span>Status</span>
        <p id="project-status"></p>
      </article>
      <article class="meta-block">
        <span>Access</span>
        <p id="project-privacy"></p>
      </article>
    </div>

    <div class="section-grid">
      <section class="section-block">
        <h2>Problem</h2>
        <p id="project-problem"></p>
      </section>
      <section class="section-block">
        <h2>Approach</h2>
        <p id="project-approach"></p>
      </section>
      <section class="section-block">
        <h2>Goal</h2>
        <p id="project-goal"></p>
      </section>
      <section class="section-block">
        <h2>Outcome</h2>
        <p id="project-outcome"></p>
      </section>
      <section class="section-block">
        <h2>Key Contributions</h2>
        <ul id="project-contributions"></ul>
      </section>
      <section class="section-block">
        <h2>Notes</h2>
        <p id="project-notes"></p>
      </section>
    </div>

    <section class="tech-strip">
      <span class="tech-title">Technologies</span>
      <div class="tech-tags" id="project-tech"></div>
    </section>

    <div class="footer-actions">
      <a class="action action-primary" href="mailto:aliarsalan.u6@gmail.com">Contact Ali</a>
      <a class="action action-secondary" href="./index.html#work">Back to Selected Work</a>
    </div>
  </main>

  <script>
    const featuredProjects = [
      {
        slug: "apro-works",
        name: "APRO Works",
        category: "Desktop Platform / Product Engineering",
        summary: "A desktop software ecosystem designed to distribute, install, manage, and launch APRO applications through one unified hub.",
        role: "IT Head / Technical and Product Lead",
        problem: "APRO needed more than a collection of unrelated tools. It needed a central environment through which users could access and manage its growing software ecosystem.",
        approach: "A lightweight desktop hub was designed around modular applications, centralized authentication, controlled distribution, and a simple install-to-launch experience.",
        contributions: [
          "Product architecture and module planning",
          "Desktop application shell",
          "Authentication and account flow",
          "Application catalogue",
          "Download and installation system",
          "Local application management",
          "Launch and uninstall workflows",
          "Cloud deployment and domain configuration",
          "Debugging across Windows, GitHub, Supabase, and Cloudflare environments"
        ],
        technologies: ["Tauri", "React", "TypeScript", "Python", "Supabase", "Cloud storage", "Git and GitHub", "Cloudflare", "Node.js", "Bun"],
        status: "Core hub workflows, including downloading, installing, running, and uninstalling applications, are functional.",
        privacy: "Private repository",
        goal: "Create a single desktop entry point for APRO's broader software ecosystem, including developer-facing and organization-facing tools.",
        outcome: "The hub now supports account access, application distribution, updates, launch flows, and local uninstall management in one place.",
        notes: "This case study presents Ali's technical and product role only. It does not present him as APRO's owner or founder."
      },
      {
        slug: "whispers-of-the-book",
        name: "Whispers of the Book",
        category: "Psychological Horror Game / Unity",
        summary: "A first-person psychological horror game built around sanity, darkness, ritual puzzles, hallucinations, and environmental storytelling.",
        role: "Game Developer / Systems Designer",
        problem: "The project needed horror mechanics that supported atmosphere and narrative pacing rather than feeling disconnected from the player experience.",
        approach: "Interconnected systems were designed around sanity loss, recovery zones, flashlight-based threat control, ritual items, environmental interaction, and reusable first-person architecture.",
        contributions: [
          "Gameplay system design tied to psychological horror",
          "First-person movement, crouching, gravity, smoothing, and head-bob controls",
          "Reusable interaction and inventory architecture",
          "Sanity, darkness, flashlight, and hallucination-related mechanics",
          "Pause, graphics, audio, controls, and gameplay settings systems",
          "Narrative item handling for ritual and progression flows",
          "Deployment planning for Windows builds and Steamworks"
        ],
        technologies: ["Unity", "C#", "Universal Render Pipeline", "Blender", "Steamworks", "Git", "3D asset workflows", "Audio and visual production tools"],
        status: "In active development and being prepared for a Steam release.",
        privacy: "Case study available",
        goal: "Translate psychological horror ideas into cohesive gameplay systems that reinforce tension, exploration, and narrative beats.",
        outcome: "A sizeable Unity project with reusable systems, a clear atmospheric direction, and documented deployment planning for PC and Steam.",
        notes: "This case study focuses on system design, atmosphere, and reusable gameplay architecture rather than exposing implementation details from the full project."
      },
      {
        slug: "pips-digital-systems",
        name: "PIPS Digital Systems",
        category: "Full-Stack Development / IT Operations",
        summary: "Ongoing development, deployment, maintenance, and modernization of digital platforms used by a research and policy organization.",
        role: "IT Head",
        problem: "A live organizational ecosystem needed reliable maintenance, modernization, production troubleshooting, and better translation of operational needs into usable systems.",
        approach: "Treat the ecosystem as a connected set of public platforms, content systems, hosting environments, databases, and internal workflows rather than as isolated websites.",
        contributions: [
          "Leading day-to-day IT operations",
          "Developing and maintaining organizational websites",
          "Managing WordPress and custom web platforms",
          "Resolving production issues",
          "Managing hosting, deployments, domains, and DNS",
          "Working with databases, backend data, and plugin or API integrations",
          "Supporting staff with hardware and software",
          "Helping convert organizational requirements into digital systems"
        ],
        technologies: ["WordPress", "PHP", "JavaScript", "HTML", "CSS", "Node.js", "MySQL", "Supabase", "Cloudflare", "Hostinger", "REST APIs", "Git", "DNS management"],
        status: "Ongoing professional work across public-facing platforms and internal systems since July 2025.",
        privacy: "Organizational systems",
        goal: "Support and improve a broad digital ecosystem used by staff, readers, and internal operations.",
        outcome: "Ongoing maintenance, modernization, troubleshooting, and new digital work across PIPS, Tajziat, Narratives, Pakistan Saga, and internal systems.",
        notes: "This ecosystem is separate from APRO and includes public-facing platforms as well as internal organizational systems."
      },
      {
        slug: "ai-rfp-analyzer",
        name: "AI RFP Analyzer and Proposal Assistant",
        category: "AI Workflow / Hackathon Project",
        summary: "An AI-assisted document pipeline that extracts structured requirements from complex RFP documents and generates an initial proposal draft.",
        role: "Team contribution within Space Raccoons",
        problem: "Complex RFP documents are difficult to parse quickly, especially when requirements need to be extracted into reliable structured fields before drafting a response.",
        approach: "The workflow combined PDF handling, OCR where needed, retrieval-augmented generation, structured extraction, proposal drafting, and a local-model or API-model switch.",
        contributions: [
          "Pipeline integration",
          "Document-processing flow",
          "RAG integration",
          "Structured extraction",
          "JSON validation",
          "Proposal generation",
          "Performance testing",
          "Local and API model support",
          "Debugging and product decisions"
        ],
        technologies: ["Python", "OCR", "Retrieval-augmented generation", "Language models", "JSON", "PDF processing", "Local AI models", "API-based AI models"],
        status: "Functional hackathon prototype.",
        privacy: "Hackathon project",
        goal: "Reduce the time it takes to understand large RFP documents and produce a structured starting point for a proposal workflow.",
        outcome: "A working pipeline from PDF to extracted JSON and draft proposal, with NO-GO handling preserved when requirements are not satisfied.",
        notes: "This project is presented as team work rather than sole ownership."
      }
    ];

    const params = new URLSearchParams(window.location.search);
    const slug = params.get("project") || "apro-works";
    const project = featuredProjects.find((item) => item.slug === slug) || featuredProjects[0];

    document.title = `${project.name} | Ali Arsalan`;
    document.getElementById("project-category").textContent = project.category;
    document.getElementById("project-name").textContent = project.name;
    document.getElementById("project-summary").textContent = project.summary;
    document.getElementById("project-role").textContent = project.role;
    document.getElementById("project-status").textContent = project.status;
    document.getElementById("project-privacy").textContent = project.privacy;
    document.getElementById("project-problem").textContent = project.problem;
    document.getElementById("project-approach").textContent = project.approach;
    document.getElementById("project-goal").textContent = project.goal;
    document.getElementById("project-outcome").textContent = project.outcome;
    document.getElementById("project-notes").textContent = project.notes;
    document.getElementById("project-contributions").innerHTML = project.contributions.map((item) => `<li>${item}</li>`).join("");
    document.getElementById("project-tech").innerHTML = project.technologies.map((item) => `<span class="chip">${item}</span>`).join("");
  </script>
</body>
</html>
